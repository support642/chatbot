# Local test stack: Postgres + chatbot service. No .env needed, no production access.
#   docker compose -f docker-compose.local.yml up -d --build
# Optional: OPENAI_API_KEY=sk-... docker compose -f docker-compose.local.yml up -d --build
services:
  postgres:
    # Debian image + self-signed cert, because the main backend always connects with SSL (AWS RDS style)
    image: postgres:17
    container_name: botivate-chatbot-localdb
    command: >
      sh -c "mkdir -p /certs && cd /certs &&
      (test -f server.key || openssl req -new -x509 -days 3650 -nodes -subj /CN=localhost -out server.crt -keyout server.key) &&
      chown postgres:postgres server.* && chmod 600 server.key &&
      exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key"
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: rama_local
    ports:
      - "5440:5432"
    volumes:
      - localdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rama_local"]
      interval: 5s
      retries: 10

  chatbot:
    build: .
    container_name: botivate-chatbot-local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "4001"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: test
      DB_NAME: rama_local
      DB_SSL: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SETTINGS_ENCRYPTION_KEY: local-test-encryption-key-0123456789abcdef
      CORS_ORIGINS: http://localhost:5173,http://localhost:5175
    ports:
      - "4001:4001"

volumes:
  localdb:
