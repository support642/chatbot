services:
  chatbot:
    build: .
    image: botivate/chatbot-service:${IMAGE_TAG:-latest}
    container_name: botivate-chatbot
    restart: unless-stopped
    env_file: .env
    ports:
      - "4001:4001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
